<app-recovery-shell>

  <div class="reset-card">

    <!-- Botón Volver -->
    <button type="button" class="back-button" (click)="onBack()">
      <mat-icon>arrow_back</mat-icon>
      <span>Volver</span>
    </button>

    <!-- Encabezado -->
    <header class="reset-header">
      <h1 class="title">Nueva Contraseña</h1>
      <p class="subtitle">Crea una contraseña segura para proteger tu cuenta</p>
    </header>

    <!-- Banner de error -->
    @if (error()) {
      <div class="error-banner" role="alert">
        <mat-icon class="error-icon">error_outline</mat-icon>
        <span>{{ error() }}</span>
      </div>
    }

    <!-- Formulario -->
    <app-reset-password-form (submitPassword)="onPasswordSubmit($event)"></app-reset-password-form>

  </div>

</app-recovery-shell>
