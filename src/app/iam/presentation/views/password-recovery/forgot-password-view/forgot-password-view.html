<app-recovery-shell>

  <div class="forgot-card">

    <!-- Encabezado -->
    <header class="forgot-header">
      <h1 class="title">¿Olvidastes tu Contraseña?</h1>
      <p class="subtitle">Ingresa tu correo para recibir un codigo de recuperacion</p>
    </header>

    <!-- Banner de error (si el backend falla) -->
    @if (error()) {
      <div class="error-banner" role="alert">
        <mat-icon>error_outline</mat-icon>
        <span>{{ error() }}</span>
      </div>
    }

    <!-- Formulario -->
    <app-forgot-password-form
      [loading]="loading()"
      (submitEmail)="onEmailSubmit($event)">
    </app-forgot-password-form>

    <!-- Enlace de retorno -->
    <a routerLink="/auth/login" class="back-link">
      <mat-icon>login</mat-icon>
      Volver al Inicio de Sesión
    </a>
  </div>


</app-recovery-shell>
