<form (ngSubmit)="onSubmit()" class="forgot-form">

  <!-- Campo Email -->
  <div class="form-group">
    <label class="field-label">Correo Electronico</label>
    <mat-form-field appearance="outline" class="custom-field">
      <input
        matInput
        type="email"
        [(ngModel)]="email"
        name="email"
        placeholder="ejemplo@correo.com"
        required>
      <mat-icon matPrefix class="field-prefix-icon">mail_outline</mat-icon>
    </mat-form-field>
  </div>

  <!-- Botón Enviar Código -->
  <button
    mat-flat-button
    type="submit"
    class="submit-button"
    [disabled]="!isValid || loading">

    @if (loading) {
      <span class="spinner"></span>
      Enviando...
    } @else {
      <mat-icon>send</mat-icon>
      Enviar Codigo
    }
  </button>

</form>
