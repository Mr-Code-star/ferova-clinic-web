<div class="modal-wrapper">
  <header class="modal-header">
    <h2>Justificar Abandono</h2>
    <button class="btn-close" (click)="onCancel()"><mat-icon>close</mat-icon></button>
  </header>

  <div class="modal-body">
    <label>NOTAS ADICIONALES</label>
    <textarea
      [(ngModel)]="observation"
      placeholder="No hay respuesta de dicho paciente, no se ha tomado la dosis..."
      rows="6"></textarea>
  </div>

  <footer class="modal-footer">
    <button class="btn-cancel" (click)="onCancel()">Cancelar</button>
    <button class="btn-abandon" [disabled]="!observation.trim()" (click)="onConfirm()">
      <mat-icon>warning</mat-icon> CONFIRMAR ABANDONO
    </button>
  </footer>
</div>
