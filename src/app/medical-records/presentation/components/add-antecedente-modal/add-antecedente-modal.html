<div class="modal-wrapper">
  <header class="modal-header">
    <h2 class="title">Añadir Antecedente</h2>
  </header>

  <div class="modal-body">
    <div class="form-group">
      <label>TIPO DE ANTECEDENTE</label>
      <input
        type="text"
        list="tipos-sugeridos"
        [(ngModel)]="type"
        placeholder="Seleccione tipo o escriba">
      <datalist id="tipos-sugeridos">
        @for (opt of tipoOptions; track opt) {
          <option [value]="opt">{{ opt }}</option>
        }
      </datalist>
    </div>

    <div class="form-group">
      <label>DESCRIPCIÓN</label>
      <textarea
        [(ngModel)]="description"
        placeholder="Describa el diagnóstico, fecha aproximada o detalles relevantes..."
        rows="3"></textarea>
    </div>

    <div class="info-box">
      <mat-icon>info_outline</mat-icon>
      <p>Esta información será visible para todo el equipo médico encargado del seguimiento de la anemia del paciente.</p>
    </div>
  </div>

  <footer class="modal-footer">
    <button class="btn-cancel" (click)="onCancel()">Cancelar</button>
    <button class="btn-add" [disabled]="!isValid()" (click)="onAdd()">
      + Añadir
    </button>
  </footer>
</div>
