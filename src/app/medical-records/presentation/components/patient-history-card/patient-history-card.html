<div
  class="history-card"
  [class.no-click]="hasMedicalRecord"
  (click)="!hasMedicalRecord ? onClick() : null">

  <div class="card-left">
    <div class="avatar">
      <mat-icon>person_outline</mat-icon>
    </div>
    <div class="info">
      <h3 class="name">{{ patient.patientName }}</h3>
      <span class="name">{{ patient.patientLastName }}</span>
      @if (patient.age) {
        <span class="age">{{ patient.age }}</span>
        <span class="dot">•</span>
      }
    </div>
  </div>

  <div class="card-right">
    @if (hasMedicalRecord) {
      <div class="actions-container">
        <button mat-stroked-button class="btn-view" (click)="onViewHistory($event)">
          Ver Historial
        </button>
        <button mat-flat-button class="btn-update" (click)="onUpdate($event)">
          Actualizar
        </button>
      </div>
    } @else {
      <mat-icon class="arrow-icon">arrow_forward</mat-icon>
    }
  </div>
</div>
