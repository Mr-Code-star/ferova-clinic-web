<div class="missing-view-container">

  <!-- Botón volver -->
  <button class="btn-back-link" (click)="onBack()">
    <mat-icon>arrow_back_ios</mat-icon>
    Volver al perfil de {{ patientName }}
  </button>

  <!-- Tarjeta principal -->
  <div class="missing-card">

    <div class="illustration-wrapper">
      <!-- Icono de carpeta médica -->
      <mat-icon class="main-icon">folder_shared</mat-icon>
      <div class="plus-badge">
        <mat-icon>add</mat-icon>
      </div>
    </div>

    <span class="badge-action">ACCIÓN REQUERIDA</span>

    <h1 class="title">Falta Historial Médico</h1>

    <p class="description">
      Para registrar un control de hemoglobina, primero es necesario completar el historial médico del paciente.
    </p>

    <button mat-flat-button class="btn-register" (click)="onRegisterMedicalRecord()">
      <mat-icon>edit_document</mat-icon>
      Registrar Historial Médico
    </button>

    <p class="time-estimate">Este registro tomará aproximadamente 3 a 5 minutos.</p>

  </div>

</div>
