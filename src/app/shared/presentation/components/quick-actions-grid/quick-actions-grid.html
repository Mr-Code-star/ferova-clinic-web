<div class="quick-actions">
  <h3 class="section-title">Accesos Rápidos</h3>

  <div class="grid">
    <button class="action-card" (click)="goToStartTreatment()">
      <div class="icon-wrapper"><mat-icon>add_box</mat-icon></div>
      <span>Iniciar Tratamiento</span>
    </button>

    <button class="action-card" (click)="goToRegisterControl()">
      <div class="icon-wrapper"><mat-icon>assignment</mat-icon></div>
      <span>Registrar Control</span>
    </button>

    <button class="action-card">
      <div class="icon-wrapper"><mat-icon>list_alt</mat-icon></div>
      <span>Mis Tratamientos</span>
    </button>

    <button class="action-card" (click)="goToDischarge()">
      <div class="icon-wrapper"><mat-icon>person_add</mat-icon></div>
      <span>Dar de Alta</span>
    </button>
  </div>
</div>
